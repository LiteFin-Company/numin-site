name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-e-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # O lint do site está limpo: aqui ele é exigido inteiro, não só "não piorar".
      - run: npm run lint
      - run: npm run build
